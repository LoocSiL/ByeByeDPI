name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout с сабмодулями
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: NDK и CMake
        run: |
          yes | sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Права на gradlew
        run: chmod +x ./gradlew

      # Keystore из секретов -> переменные окружения, которые читает build.gradle.kts.
      # Благодаря этому debug и release подписываются одним и тем же стабильным ключом,
      # и сборку можно обновлять на устройстве без переустановки.
      - name: Подготовка подписи
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Сборка debug (устанавливается на устройство)
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Сборка release
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: byebyedpi-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Отчёт о сборке
        if: always()
        run: |
          {
            echo "### Результат сборки"
            echo '```'
            find app/build/outputs/apk signed -name '*.apk' -exec ls -lh {} \; 2>/dev/null || echo "APK не найден"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
