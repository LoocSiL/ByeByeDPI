name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout с сабмодулями
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: NDK и CMake
        run: |
          yes | sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Права на gradlew
        run: chmod +x ./gradlew

      # Debug-сборка подписывается отладочным ключом Gradle автоматически,
      # поэтому её можно установить на устройство без keystore и секретов.
      - name: Сборка debug (подписанный APK)
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Подпись release, если заданы секреты
        continue-on-error: true
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::Секреты подписи не заданы — только debug APK"
            exit 0
          fi
          ./gradlew assembleRelease --stacktrace --no-daemon
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p signed
          for apk in app/build/outputs/apk/release/*-unsigned.apk; do
            [ -e "$apk" ] || continue
            base=$(basename "$apk" -unsigned.apk)
            "$BT/zipalign" -p -f 4 "$apk" "signed/$base-aligned.apk"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.keystore" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "signed/$base-signed.apk" "signed/$base-aligned.apk"
            "$BT/apksigner" verify --print-certs "signed/$base-signed.apk" | head -2
          done
          rm -f signed/*-aligned.apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: byebyedpi-apk
          path: |
            signed/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Отчёт о сборке
        if: always()
        run: |
          {
            echo "### Результат сборки"
            echo '```'
            find app/build/outputs/apk signed -name '*.apk' -exec ls -lh {} \; 2>/dev/null || echo "APK не найден"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
